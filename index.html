<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>데일리 퍼즐</title>
  <meta name="theme-color" content="#2f9e60"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="데일리 퍼즐"/>
  <link rel="icon" href="icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <script>
    // body가 그려지기 전에 먼저 적용해서 라이트 테마가 잠깐 번쩍이는 걸 막는다
    // (허브 설정이 없으면 게임 쪽 설정 중 하나라도 켜져 있으면 다크)
    try {
      const hub = localStorage.getItem('daily-dark-mode');
      const on = hub != null ? hub === '1'
        : ['sudoku-dark-mode', 'trilateral-dark-mode', 'wordship-dark-mode'].some((k) => localStorage.getItem(k) === '1');
      if (on) document.documentElement.setAttribute('data-theme', 'dark');
    } catch {}
  </script>
  <style>
    /* 색·카드 모양은 세 게임의 랜딩 화면(style.css)과 같게 맞춘다 */
    :root {
      --conflict:            #e53e3e;
      --text-given:          #232733;
      --text-given-rgb:      35, 39, 51;
      --text-input:          #2f9e60;
      --text-sel:            #1e6b41;
      --cell-selected:       #d3ecdc;
      --bg-page:             #ffffff;
      --landing-gradient:    linear-gradient(160deg, #eef4f0, #ffffff 60%);
      --glass-rgb:           255, 255, 255;
      --surface-solid:       #ffffff;
      --surface-solid-hover: #f5f6f8;
      --surface-1:           #f0f1f4;
      --surface-1-hover:     #e6e7ec;
      --surface-danger:      #fff1f1;
      --playing-bg:          #fff3d6;
      --playing-text:        #a9791d;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --conflict:            #f0655f;
      --text-given:          #e4e6ea;
      --text-given-rgb:      228, 230, 234;
      --text-input:          #4cc47f;
      --text-sel:            #86e6b3;
      --cell-selected:       #234534;
      --bg-page:             #14161c;
      --landing-gradient:    linear-gradient(160deg, #182420, #14161c 60%);
      --glass-rgb:           24, 27, 34;
      --surface-solid:       #1c1f27;
      --surface-solid-hover: #262a35;
      --surface-1:           #262a35;
      --surface-1-hover:     #303543;
      --surface-danger:      #3a2226;
      --playing-bg:          #3a3320;
      --playing-text:        #e0b24c;
    }

    * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg-page);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { background: var(--landing-gradient); }

    /* ── 가로 스와이프 트랙 ── */
    .hub-track {
      display: flex;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
    }
    .hub-slide {
      flex: 0 0 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      padding: 16px 16px 56px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
    }

    /* ── 게임 카드 (= 각 게임의 랜딩 카드) ── */
    /* 카드 안은 스크롤하지 않는다 — 화면이 낮으면 아래 @media (max-height) 에서 여백·크기를 줄여 한 화면에 맞춘다 */
    .landing-card {
      width: min(340px, calc(100vw - 32px));
      flex-shrink: 0;
      padding: 48px 36px 40px;
      border-radius: 28px;
      background: rgba(var(--glass-rgb), 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(var(--glass-rgb), 0.6);
      box-shadow: 0 24px 60px rgba(20, 24, 40, 0.18);
      text-align: center;
    }
    .landing-title {
      margin: 0 0 32px;
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--text-given);
    }
    .landing-title-icon { font-size: 0.9em; margin-right: 2px; }
    .landing-date {
      margin: -20px 0 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(var(--text-given-rgb), 0.55);
    }
    .landing-stack { display: flex; flex-direction: column; gap: 14px; }

    .daily-cards { display: flex; flex-direction: column; gap: 12px; }
    .daily-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 16px 18px;
      border: 1px solid rgba(var(--glass-rgb), 0.6);
      border-radius: 16px;
      background: var(--surface-solid);
      text-align: left;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(20, 24, 40, 0.08);
      transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .daily-card:hover { background: var(--surface-solid-hover); box-shadow: 0 6px 16px rgba(20, 24, 40, 0.16); }
    .daily-card:active { transform: scale(0.98); }
    .daily-card-name {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-given);
    }
    .daily-card-desc { font-size: 12px; color: rgba(var(--text-given-rgb), 0.55); }
    .daily-card-status {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-1);
      color: rgba(var(--text-given-rgb), 0.6);
    }
    .daily-card-status[data-status="solved"]  { background: var(--cell-selected); color: var(--text-sel); }
    .daily-card-status[data-status="timeout"] { background: var(--surface-danger); color: var(--conflict); }
    .daily-card-status[data-status="playing"] { background: var(--playing-bg); color: var(--playing-text); }

    .landing-row { display: flex; gap: 10px; }
    .landing-btn {
      flex: 1;
      min-width: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: var(--surface-1);
      color: var(--text-given);
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(20, 24, 40, 0.08);
      transition: transform 0.08s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .landing-btn:hover { background: var(--surface-1-hover); box-shadow: 0 4px 10px rgba(20, 24, 40, 0.14); }
    .landing-btn:active { transform: scale(0.97); }

    .landing-mini-actions { display: flex; gap: 6px; margin-top: 6px; }
    .landing-mini-btn {
      flex: 1;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: rgba(var(--text-given-rgb), 0.6);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .landing-mini-btn:hover { background: var(--surface-1); color: var(--text-given); }

    .landing-footer {
      margin: 28px 0 0;
      font-size: 11px;
      color: rgba(var(--text-given-rgb), 0.4);
    }
    .landing-footer a { color: inherit; text-decoration: none; }
    .landing-footer a:hover { color: rgba(var(--text-given-rgb), 0.7); text-decoration: underline; }

    /* ── 카드 안 하위 화면(지난 퍼즐 · 자유 연습 · 통계) — 같은 카드 안에서 메인과 바꿔 보여 준다 ── */
    .landing-card { position: relative; }
    /* 카드 폭은 그대로 — 안쪽 여백만 줄여 달력 칸을 넓힌다 */
    .landing-card.is-sub { padding-left: 22px; padding-right: 22px; }
    .is-sub .landing-footer { display: none; }
    .is-sub .landing-date { display: none; }
    .is-sub .landing-title { margin-bottom: 20px; }
    .landing-stack[hidden], .hub-back[hidden] { display: none; }
    .hub-back {
      position: absolute;
      top: 14px;
      left: 16px;
      padding: 6px 10px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: rgba(var(--text-given-rgb), 0.55);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .hub-back:hover { background: var(--surface-1); color: var(--text-given); }

    .sub-stack { gap: 11px; }
    .archive-note { margin: 0; font-size: 12px; color: rgba(var(--text-given-rgb), 0.55); }
    .mode-tabs { display: flex; gap: 6px; }
    .mode-tab {
      flex: 1;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: var(--surface-1);
      color: rgba(var(--text-given-rgb), 0.6);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-tab.active { background: var(--text-input); color: #fff; }
    .archive-error { margin: 0; font-size: 12px; color: var(--conflict); }
    .archive-error:empty { display: none; }
    .primary-btn {
      flex: none;
      height: 46px;
      margin-top: 4px;
      border: none;
      background: var(--text-input);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .primary-btn:hover { background: var(--text-sel); }
    .primary-btn:disabled { opacity: 0.4; cursor: default; background: var(--text-input); }

    .daily-cal-nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 4px; }
    .daily-cal-title {
      margin: 0;
      min-width: 92px;
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-given);
    }
    .daily-cal-arrow {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 8px;
      background: var(--surface-1);
      color: rgba(var(--text-given-rgb), 0.7);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }
    .daily-cal-arrow:hover { background: rgba(var(--text-given-rgb), 0.1); color: var(--text-given); }
    .daily-cal-arrow:disabled { opacity: 0.3; cursor: default; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-head { margin-bottom: 3px; }
    .cal-dow { padding: 1px 0; font-size: 10px; font-weight: 700; color: rgba(var(--text-given-rgb), 0.4); }
    .cal-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      background: var(--surface-1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cal-cell--blank    { background: transparent; }
    .cal-cell--miss     { background: rgba(var(--text-given-rgb), 0.06); }
    .cal-cell--future   { opacity: 0.3; }
    .cal-cell--today    { box-shadow: inset 0 0 0 2px hsl(145 60% 28%); }
    .cal-cell--solved   { background: var(--text-input); }
    .cal-cell--fail     { background: var(--conflict); }
    .cal-cell--pickable { cursor: pointer; }
    .cal-cell--pickable:hover { box-shadow: inset 0 0 0 2px rgba(var(--text-given-rgb), 0.3); }
    .cal-cell--picked, .cal-cell--picked.cal-cell--today { box-shadow: inset 0 0 0 3px var(--text-input); }
    .cal-day {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 8px;
      font-weight: 700;
      line-height: 1;
      color: rgba(var(--text-given-rgb), 0.4);
    }
    .cal-cell--filled .cal-day { color: rgba(255, 255, 255, 0.75); }
    .cal-val { font-size: 9px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }

    /* ── 자유 연습 모드 고르기 (카드 안) ── */
    .sub-title {
      margin: 0;
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-given);
    }

    /* ── 통계 (카드 안) — 게임 통계창과 같은 내용 ── */
    .stats-numbers { display: flex; }
    .stats-num { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stats-num strong {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-given);
      font-variant-numeric: tabular-nums;
    }
    .stats-num span { font-size: 10px; color: rgba(var(--text-given-rgb), 0.55); }
    .stats-seg { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--surface-1); }
    .stats-seg button {
      flex: 1;
      height: 26px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: rgba(var(--text-given-rgb), 0.6);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .stats-seg button.active { background: var(--surface-solid); color: var(--text-given); box-shadow: 0 1px 3px rgba(20, 24, 40, 0.12); }
    .stats-pane { display: flex; flex-direction: column; gap: 6px; }
    .stats-pane[hidden] { display: none; }
    .stats-stack .cal-cell { aspect-ratio: 5 / 4; }
    .stats-stack .daily-cal-nav { position: relative; }
    .cal-share-row { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; }
    .mini-share {
      padding: 4px 8px;
      border: none;
      border-radius: 8px;
      background: var(--surface-1);
      color: rgba(var(--text-given-rgb), 0.7);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .mini-share:hover { background: var(--surface-1-hover); color: var(--text-given); }
    .share-note { font-size: 11px; font-weight: 600; color: var(--text-input); }
    .cal-share-row .share-note { position: absolute; right: 0; top: calc(100% + 2px); white-space: nowrap; }
    .share-note:empty { display: none; }
    .dist-title { margin: 0 0 2px; font-size: 12px; font-weight: 700; color: rgba(var(--text-given-rgb), 0.7); text-align: left; }
    .dist-row { display: grid; grid-template-columns: 62px 1fr 24px; align-items: center; gap: 6px; font-size: 11px; }
    .dist-label { text-align: left; white-space: nowrap; color: rgba(var(--text-given-rgb), 0.6); }
    .dist-track { height: 14px; border-radius: 4px; background: var(--surface-1); overflow: hidden; }
    .dist-fill { display: block; height: 100%; min-width: 2px; border-radius: 4px; background: var(--text-input); }
    .dist-fill.fail { background: var(--conflict); }
    .dist-count { text-align: right; font-weight: 700; color: rgba(var(--text-given-rgb), 0.7); font-variant-numeric: tabular-nums; }
    .stats-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .stats-next { display: flex; flex-direction: column; align-items: flex-start; font-size: 10px; color: rgba(var(--text-given-rgb), 0.55); }
    .stats-next strong {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 16px;
      color: var(--text-given);
      font-variant-numeric: tabular-nums;
    }
    .stats-share { flex: none; width: auto; height: 40px; margin: 0; padding: 0 22px; }

    /* ── 하단 점 (몇 번째 게임인지) ── */
    .hub-dots {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .hub-dot {
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hub-dot::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(var(--text-given-rgb), 0.22);
      transition: width 0.2s ease, background 0.2s ease;
    }
    .hub-dot[aria-current="true"]::before { width: 22px; background: var(--text-input); }

    /* ── 좌우 화살표 — 마우스 환경에서만 ── */
    .hub-arrow {
      position: fixed;
      top: 50%;
      width: 44px;
      height: 44px;
      margin-top: -22px;
      border: none;
      border-radius: 999px;
      background: rgba(var(--glass-rgb), 0.75);
      color: rgba(var(--text-given-rgb), 0.7);
      box-shadow: 0 4px 14px rgba(20, 24, 40, 0.14);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      display: none;
    }
    .hub-arrow:hover { color: var(--text-given); }
    .hub-arrow:disabled { opacity: 0; pointer-events: none; }
    .hub-arrow-prev { left: max(16px, calc(50% - 250px)); }
    .hub-arrow-next { right: max(16px, calc(50% - 250px)); }
    @media (hover: hover) and (pointer: fine) and (min-width: 520px) {
      .hub-arrow { display: block; }
    }

    /* ── 낮은 화면: 카드가 스크롤 없이 들어가도록 여백·크기를 줄인다 ── */
    @media (max-height: 680px) {
      .hub-slide {
        padding-top: calc(10px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(44px + env(safe-area-inset-bottom, 0px));
      }
      .hub-dots { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
      .landing-card { padding: 30px 28px 24px; border-radius: 24px; }
      .landing-title { margin-bottom: 24px; font-size: 24px; }
      .landing-date { margin: -16px 0 18px; }
      .landing-stack { gap: 12px; }
      .daily-cards { gap: 10px; }
      .daily-card { padding: 12px 16px; }
      .landing-btn { height: 48px; }
      .landing-mini-actions { margin-top: 0; }
      .landing-footer { margin-top: 14px; }
      .landing-card.is-sub { padding-top: 44px; } /* ‹ 뒤로 와 제목이 겹치지 않게 */
      .sub-stack { gap: 9px; }
      .mode-tab { height: 32px; }
      .is-sub .cal-cell { aspect-ratio: 6 / 5; }
      .stats-stack .cal-cell { aspect-ratio: 3 / 2; }
      .stats-num strong { font-size: 20px; }
    }
    @media (max-height: 560px) {
      .hub-slide {
        padding-top: calc(8px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(38px + env(safe-area-inset-bottom, 0px));
      }
      .hub-dots { bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }
      .landing-card { padding: 24px 24px 18px; border-radius: 20px; }
      .landing-title { margin-bottom: 18px; font-size: 22px; }
      .landing-date { margin: -8px 0 12px; font-size: 12px; }
      .landing-stack { gap: 8px; }
      .daily-cards { gap: 8px; }
      .daily-card { padding: 10px 14px; gap: 1px; }
      .daily-card-name { font-size: 15px; }
      .daily-card-desc { font-size: 11px; }
      .daily-card-status { margin-top: 3px; padding: 2px 8px; font-size: 11px; }
      .landing-btn { height: 40px; font-size: 15px; border-radius: 12px; }
      .landing-mini-btn { height: 30px; }
      .landing-footer { display: none; }
      /* 지난 퍼즐: 달력이 6줄인 달도 들어가도록 */
      .sub-stack { gap: 8px; }
      .is-sub .archive-note { display: none; }
      .mode-tab { height: 32px; }
      .is-sub .cal-cell { aspect-ratio: 5 / 4; }
      .landing-card.is-sub { padding-top: 40px; }
      .primary-btn { height: 40px; margin-top: 2px; }
      .is-sub .landing-title { margin-bottom: 12px; font-size: 20px; }
      .stats-stack .cal-cell { aspect-ratio: 2 / 1; }
      .stats-stack .cal-val { display: none; } /* 칸이 낮아 숫자 대신 색만 */
      .stats-num strong { font-size: 18px; }
      .stats-seg button { height: 24px; }
      .dist-track { height: 10px; }
      .stats-stack .stats-pane { gap: 3px; }
      .stats-stack .mode-tab { height: 28px; }
      .dist-row { font-size: 10px; }
      .stats-share { height: 36px; }
    }
    /* 그래도 넘치는 극단적인 경우(가로 모드 등)만 카드가 아닌 화면 전체가 세로로 움직인다 */
    @media (max-height: 420px) {
      .hub-slide { align-items: safe center; overflow-y: auto; }
    }
  </style>
</head>
<body>
  <main id="hub-track" class="hub-track" aria-label="게임 목록"></main>
  <button id="hub-prev" class="hub-arrow hub-arrow-prev" type="button" aria-label="이전 게임">‹</button>
  <button id="hub-next" class="hub-arrow hub-arrow-next" type="button" aria-label="다음 게임">›</button>
  <nav id="hub-dots" class="hub-dots" aria-label="게임 선택"></nav>

  <script>
    // ── 게임 목록 ──
    // dailies.open: 게임 랜딩 버튼 id (게임 쪽 src/hub.js가 ?open= 으로 받아 눌러 준다)
    // modes: 지난 퍼즐 · 통계 모드 탭 / free: 자유 연습 모드 (없으면 바로 게임으로)
    const GAMES = [
      {
        slug: 'sudoku', dir: 'DailySudoku', icon: '📝', title: '데일리 스도쿠', firstDate: '2026-09-01',
        modes: [['standard', '스탠다드'], ['extended', '익스텐디드']],
        records: (mode) => sudokuRecords(`dsudoku:stats:${mode}`),
        free: null,
        dailies: [
          { open: 'btn-daily-standard', name: '스탠다드', desc: '겹친 2판 · 요소 없음', status: (d) => sudokuStatus(d, 'standard') },
          { open: 'btn-daily-extended', name: '익스텐디드', desc: '겹친 2판 · 요소 2개', status: (d) => sudokuStatus(d, 'extended') },
        ],
      },
      {
        slug: 'trilateral', dir: 'DailyTrilateral', icon: '🔺', title: '데일리 삼각관계', firstDate: '2026-09-01',
        modes: [['standard', '스탠다드'], ['extended', '익스텐디드']],
        records: (mode) => guessRecords(mode === 'standard' ? 'trilateral:stats' : 'trilateral:stats:extended'),
        free: [['standard', '스탠다드', '3단 · 추측 4번'], ['extended', '익스텐디드', '3단 · 전체 단어 · 추측 5번']],
        dailies: [
          { open: 'btn-daily-play', name: '스탠다드', desc: '3단 · 추측 4번',
            status: (d) => guessStatus(d, 'trilateral:stats', 'trilateral:progress:' + d) },
          { open: 'btn-daily-play-extended', name: '익스텐디드', desc: '3단 · 전체 단어 · 추측 5번',
            status: (d) => guessStatus(d, 'trilateral:stats:extended', 'trilateral:progress:extended:' + d) },
        ],
      },
      {
        slug: 'wordship', dir: 'DailyWordship', icon: '🚢', title: '데일리 워드십', firstDate: '2026-09-23',
        modes: [['standard', '스탠다드'], ['idiom', '사자성어']],
        records: (mode) => guessRecords(mode === 'standard' ? 'wordship:stats' : 'wordship:stats:idiom'),
        free: [['standard', '스탠다드', '8×8 · 함선 6척 · 추측 30번'], ['idiom', '사자성어', '8×8 · 사자성어 함선 5척 · 추측 20번']],
        dailies: [
          { open: 'btn-daily-play', name: '스탠다드', desc: '8×8 · 함선 6척 · 추측 30번',
            status: (d) => guessStatus(d, 'wordship:stats', 'wordship:progress:' + d, 30) },
          { open: 'btn-daily-play-idiom', name: '사자성어', desc: '8×8 · 사자성어 함선 5척 · 추측 20번',
            status: (d) => guessStatus(d, 'wordship:stats:idiom', 'wordship:progress:idiom:' + d, 20) },
        ],
      },
    ];
    const DARK_KEYS = ['daily-dark-mode', 'sudoku-dark-mode', 'trilateral-dark-mode', 'wordship-dark-mode'];

    // ── 날짜 — 게임들과 같은 규칙: 데일리 경계 = KST 06:00 = UTC+3 자정 ──
    const DAY_OFFSET_MS = 3 * 60 * 60 * 1000;
    function todayStr() {
      return new Date(Date.now() + DAY_OFFSET_MS).toISOString().slice(0, 10);
    }
    function shiftDate(dateStr, days) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(Date.UTC(y, m - 1, d) + days * 86400000).toISOString().slice(0, 10);
    }
    function untilNextReset() {
      const t = Math.floor((86400000 - ((Date.now() + DAY_OFFSET_MS) % 86400000)) / 1000);
      return [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60].map((n) => String(n).padStart(2, '0')).join(':');
    }

    function readJSON(key) {
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch { return null; }
    }
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; } catch { /* 아래 방식으로 */ }
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.append(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      } catch { return false; }
    }

    // ── 오늘 상태 배지 — 각 게임 랜딩의 표시 규칙을 그대로 옮김 ──
    function fmtMMSS(ms) {
      const t = Math.max(0, Math.floor(ms / 1000));
      return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
    }
    function sudokuStatus(date, variant) {
      const p = readJSON(`dsudoku:progress:${date}:${variant}`);
      if (!p) return ['플레이 전', 'new'];
      if (p.status === 'solved') return ['✅ ' + fmtMMSS(p.elapsedMs), 'solved'];
      if (p.status === 'timeout' || p.status === 'gaveup') return [p.pct != null ? `❌ ${p.pct}%` : '❌ 실패', 'timeout'];
      if (p.status === 'playing' && (p.activeMs ?? 0) >= 15 * 60 * 1000) return ['❌ 시간 초과', 'timeout'];
      return ['플레이 중', 'playing'];
    }
    function guessStatus(date, statsKey, progressKey, maxGuesses) {
      const r = readJSON(statsKey)?.results?.[date];
      if (r?.status === 'solved') return ['성공', 'solved'];
      if (r?.status === 'failed') return ['실패', 'timeout'];
      const p = readJSON(progressKey);
      if (maxGuesses) {
        if (p?.guesses?.length) return [`진행 중 · ${p.guesses.length}/${maxGuesses}`, 'playing'];
      } else if (p?.status === 'playing') return ['진행 중', 'playing'];
      return ['플레이 전', 'new'];
    }

    // ── 달력 칸 기록 — 각 게임 달력과 같은 표시 ──
    // 스도쿠: 평균보다 빠를수록 진한 초록(시간) / 완성률이 낮을수록 진한 빨강(%)
    function calSolveColor(ms, avg) {
      if (!avg) return 'hsl(145 42% 45%)';
      const k = Math.max(-1, Math.min(1, (avg - ms) / avg));
      return `hsl(145 42% ${46 - k * 12}%)`;
    }
    function calFailColor(pct, avg) {
      const p = pct ?? 0;
      if (!avg) return 'hsl(5 58% 52%)';
      const k = Math.max(-1, Math.min(1, (p - avg) / avg));
      return `hsl(5 58% ${48 + k * 11}%)`;
    }
    function sudokuRecords(statsKey) {
      const results = readJSON(statsKey)?.results ?? {};
      let wins = 0, solveSum = 0, fails = 0, failSum = 0;
      for (const r of Object.values(results)) {
        if (r.status === 'solved') { wins++; solveSum += r.elapsedMs || 0; } else { fails++; failSum += r.pct || 0; }
      }
      const avgSolve = wins ? solveSum / wins : null;
      const avgFail = fails ? failSum / fails : null;
      return (date) => {
        const r = results[date];
        if (!r) return null;
        return r.status === 'solved'
          ? { bg: calSolveColor(r.elapsedMs, avgSolve), val: fmtMMSS(r.elapsedMs) }
          : { bg: calFailColor(r.pct, avgFail), val: `${r.pct ?? 0}%` };
      };
    }
    // 삼각관계·워드십: 성공 = 맞힌 시도 번호, 실패 = ✕
    function guessRecords(statsKey) {
      const results = readJSON(statsKey)?.results ?? {};
      return (date) => {
        const r = results[date];
        if (!r) return null;
        return r.status === 'solved'
          ? { cls: 'cal-cell--solved', val: r.attempt ? `${r.attempt}번` : '✓' }
          : { cls: 'cal-cell--fail', val: '✕' };
      };
    }

    // ── 공통 조각 ──
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const link = (href, cls, text) => { const a = el('a', cls, text); a.href = href; return a; };
    const button = (cls, text) => { const b = el('button', cls, text); b.type = 'button'; return b; };
    const openUrl = (game, id) => `${game.dir}/?open=${id}`;
    function flash(noteEl, text) {
      noteEl.textContent = text;
      clearTimeout(noteEl._t);
      noteEl._t = setTimeout(() => { noteEl.textContent = ''; }, 2600);
    }

    // 모드 탭 (지난 퍼즐 · 통계 공용)
    function modeTabs(game, onPick) {
      const wrap = el('div', 'mode-tabs');
      const btns = game.modes.map(([id, label]) => {
        const b = button('mode-tab', label);
        b.addEventListener('click', () => onPick(id));
        wrap.append(b);
        return b;
      });
      return { wrap, set: (mode) => btns.forEach((b, j) => b.classList.toggle('active', game.modes[j][0] === mode)) };
    }

    // 월 달력 (지난 퍼즐 · 통계 공용) — 게임 달력과 같은 규칙: 첫 달 이전·이번 달 이후로는 못 넘어감
    const CAL_WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    function monthCalendar(game, { pick = false, onPick = null } = {}) {
      let offset = 0;
      const nav = el('div', 'daily-cal-nav');
      const prev = button('daily-cal-arrow', '‹');
      const title = el('h3', 'daily-cal-title');
      const next = button('daily-cal-arrow', '›');
      prev.setAttribute('aria-label', '이전 달');
      next.setAttribute('aria-label', '다음 달');
      nav.append(prev, title, next);
      const grid = el('div', 'archive-cal');
      let last = null;
      prev.addEventListener('click', () => { offset -= 1; draw(last); });
      next.addEventListener('click', () => { if (offset < 0) { offset += 1; draw(last); } });

      function ym() {
        const [ty, tm] = todayStr().split('-').map(Number);
        const first = new Date(Date.UTC(ty, tm - 1 + offset, 1));
        return { y: first.getUTCFullYear(), m: first.getUTCMonth() + 1, dow: first.getUTCDay() };
      }
      function draw(opts) {
        last = opts;
        const { mode, selected = null } = opts;
        const today = todayStr();
        const maxDate = shiftDate(today, -1);
        const record = game.records(mode);
        const { y, m, dow } = ym();
        const mm = String(m).padStart(2, '0');
        title.textContent = `${y}년 ${m}월`;
        next.disabled = offset >= 0;
        prev.disabled = `${y}-${mm}` <= game.firstDate.slice(0, 7);

        grid.textContent = '';
        const head = el('div', 'cal-grid cal-head');
        CAL_WEEKDAYS.forEach((w) => head.append(el('span', 'cal-dow', w)));
        const cells = el('div', 'cal-grid');
        for (let k = 0; k < dow; k++) cells.append(el('span', 'cal-cell cal-cell--blank'));
        const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
        for (let d = 1; d <= days; d++) {
          const date = `${y}-${mm}-${String(d).padStart(2, '0')}`;
          const cell = el('span', 'cal-cell');
          cell.append(el('span', 'cal-day', d));
          if (date === today) cell.classList.add('cal-cell--today');
          if (pick && date === selected) cell.classList.add('cal-cell--picked');
          const r = record(date);
          if (r) {
            cell.classList.add('cal-cell--filled');
            if (r.cls) cell.classList.add(r.cls);
            if (r.bg) cell.style.background = r.bg;
            cell.append(el('span', 'cal-val', r.val));
          } else if (date > today) cell.classList.add('cal-cell--future');
          else cell.classList.add('cal-cell--miss');
          if (pick && date >= game.firstDate && date <= maxDate) {
            cell.classList.add('cal-cell--pickable');
            cell.addEventListener('click', () => onPick(date));
          }
          cells.append(cell);
        }
        grid.append(head, cells);
      }
      return { nav, grid, draw, ym, reset: () => { offset = 0; } };
    }

    // ── 지난 퍼즐 — 날짜를 고르고 플레이하면 게임이 ?archive=날짜&mode=모드 로 바로 시작 ──
    function archiveView(game) {
      const st = { mode: game.modes[0][0], selected: null };
      const view = el('div', 'landing-stack sub-stack archive-stack');
      const note = el('p', 'archive-note', '연습용 — 통계·연승에 반영되지 않습니다.');
      const tabs = modeTabs(game, (mode) => { st.mode = mode; render(); }); // 달·고른 날짜는 유지
      const cal = monthCalendar(game, { pick: true, onPick: (date) => { st.selected = date; render(); } });
      const error = el('p', 'archive-error');
      const play = button('landing-btn primary-btn archive-play', '플레이');
      play.addEventListener('click', () => {
        if (st.selected) location.href = `${game.dir}/?archive=${st.selected}&mode=${st.mode}`;
      });
      view.append(note, tabs.wrap, cal.nav, cal.grid, error, play);

      function render() {
        tabs.set(st.mode);
        error.textContent = todayStr() <= game.firstDate ? '아직 지난 퍼즐이 없어요 — 내일부터 열려요.' : '';
        play.disabled = !st.selected;
        cal.draw({ mode: st.mode, selected: st.selected });
      }
      return {
        view, render,
        open() { st.mode = game.modes[0][0]; st.selected = null; cal.reset(); render(); }, // 들어올 때마다 스탠다드부터
      };
    }

    // ── 자유 연습 모드 고르기 — 고르면 게임이 ?free=모드 로 바로 시작 ──
    function freeView(game) {
      const view = el('div', 'landing-stack');
      const cards = el('div', 'daily-cards');
      for (const [mode, name, desc] of game.free) {
        const a = link(`${game.dir}/?free=${mode}`, 'daily-card');
        a.append(el('span', 'daily-card-name', name), el('span', 'daily-card-desc', desc));
        cards.append(a);
      }
      view.append(el('h3', 'sub-title', '자유 연습 모드'), cards);
      return { view, render() {}, open() {} };
    }

    // ── 통계 — 숫자·분포·공유 문구는 게임의 src/hubApi.js(게임 통계창과 같은 계산)로 ──
    const apiCache = new Map();
    const loadApi = (game) => {
      if (!apiCache.has(game.slug)) apiCache.set(game.slug, import(`./${game.dir}/src/hubApi.js`));
      return apiCache.get(game.slug);
    };
    function statsView(game) {
      const st = { mode: game.modes[0][0], pane: 'cal' };
      let timer = 0;
      const view = el('div', 'landing-stack sub-stack stats-stack');
      const tabs = modeTabs(game, (mode) => { st.mode = mode; render(); });

      const numbers = el('div', 'stats-numbers');
      const num = {};
      for (const [key, label] of [['played', '게임'], ['winRate', '승률(%)'], ['curStreak', '현재 연승'], ['maxStreak', '최고 연승']]) {
        const box = el('div', 'stats-num');
        num[key] = el('strong', null, '0');
        box.append(num[key], el('span', null, label));
        numbers.append(box);
      }

      // 달력 / 분포 — 둘 다 펼치면 카드가 너무 길어져서 한 번에 하나씩
      const seg = el('div', 'stats-seg');
      const segBtns = { cal: button(null, '달력'), dist: button(null, '분포') };
      Object.entries(segBtns).forEach(([pane, b]) => { b.addEventListener('click', () => { st.pane = pane; render(); }); seg.append(b); });

      const calPane = el('div', 'stats-pane');
      const cal = monthCalendar(game);
      const calShareRow = el('div', 'cal-share-row');
      const calShare = button('mini-share', '📋 공유');
      calShare.setAttribute('aria-label', '달력 공유');
      const calNote = el('span', 'share-note');
      calShareRow.append(calShare, calNote);
      cal.nav.append(calShareRow); // 달 이동 줄 오른쪽 — 한 줄 아끼기
      calPane.append(cal.nav, cal.grid);

      const distPane = el('div', 'stats-pane');
      const distTitle = el('h3', 'dist-title');
      const distRows = el('div', 'stats-pane');
      distPane.append(distTitle, distRows);

      const footer = el('div', 'stats-footer');
      const next = el('div', 'stats-next');
      const countdown = el('strong', null, '--:--:--');
      next.append(el('span', null, '다음 데일리까지'), countdown);
      const share = button('landing-btn primary-btn stats-share', '공유');
      footer.append(next, share);
      const shareNote = el('p', 'archive-error share-note');

      view.append(tabs.wrap, numbers, seg, calPane, distPane, footer, shareNote);

      calShare.addEventListener('click', async () => {
        const api = await loadApi(game);
        const { y, m } = cal.ym();
        flash(calNote, (await copyText(api.calendarShareText(st.mode, y, m))) ? '복사했어요!' : '복사 실패');
      });
      share.addEventListener('click', async () => {
        try {
          const api = await loadApi(game);
          const text = await api.todayShareText(st.mode);
          if (!text) { flash(shareNote, '오늘 퍼즐을 먼저 풀어주세요.'); return; }
          flash(shareNote, (await copyText(text)) ? '클립보드에 복사했어요!' : '복사 실패');
        } catch (err) {
          console.error(err);
          flash(shareNote, '공유 문구를 만들지 못했어요.');
        }
      });

      async function render() {
        tabs.set(st.mode);
        Object.entries(segBtns).forEach(([pane, b]) => b.classList.toggle('active', pane === st.pane));
        calPane.hidden = st.pane !== 'cal';
        distPane.hidden = st.pane !== 'dist';
        cal.draw({ mode: st.mode });
        let s;
        try { s = (await loadApi(game)).stats(st.mode); } catch (err) {
          console.error(err);
          shareNote.textContent = '통계를 불러오지 못했어요.';
          return;
        }
        num.played.textContent = s.played;
        num.winRate.textContent = s.winRate;
        num.curStreak.textContent = s.curStreak;
        num.maxStreak.textContent = s.maxStreak;
        distTitle.textContent = s.distTitle;
        const max = Math.max(1, ...s.dist.map((d) => d.count));
        distRows.textContent = '';
        for (const d of s.dist) {
          const row = el('div', 'dist-row');
          const track = el('span', 'dist-track');
          const fill = el('span', 'dist-fill' + (d.fail ? ' fail' : ''));
          fill.style.width = `${(d.count / max) * 100}%`;
          track.append(fill);
          row.append(el('span', 'dist-label', d.label), track, el('span', 'dist-count', d.count));
          distRows.append(row);
        }
      }
      return {
        view, render,
        open() {
          st.mode = game.modes[0][0];
          st.pane = 'cal';
          cal.reset();
          render();
          const tick = () => { countdown.textContent = untilNextReset(); };
          tick();
          clearInterval(timer);
          timer = setInterval(tick, 1000);
        },
        close() { clearInterval(timer); },
      };
    }

    // ── 그리기 ──
    const track = document.getElementById('hub-track');
    const dotsEl = document.getElementById('hub-dots');
    const prevBtn = document.getElementById('hub-prev');
    const nextBtn = document.getElementById('hub-next');
    const cardViews = []; // 카드마다 { show(name), current() }

    GAMES.forEach((game, i) => {
      const slide = el('section', 'hub-slide');
      slide.id = game.slug;
      slide.setAttribute('aria-label', game.title);
      const card = el('div', 'landing-card');
      const back = button('hub-back', '‹ 뒤로');
      back.hidden = true;

      const h1 = el('h1', 'landing-title');
      const icon = el('span', 'landing-title-icon', game.icon);
      icon.setAttribute('aria-hidden', 'true');
      h1.append(icon, ' ' + game.title);
      const date = el('p', 'landing-date');
      date.dataset.date = '';

      // 메인
      const main = el('div', 'landing-stack');
      const cards = el('div', 'daily-cards');
      game.dailies.forEach((daily, di) => {
        const a = link(openUrl(game, daily.open), 'daily-card');
        const badge = el('span', 'daily-card-status');
        badge.dataset.statusFor = `${i}:${di}`;
        a.append(el('span', 'daily-card-name', daily.name), el('span', 'daily-card-desc', daily.desc), badge);
        cards.append(a);
      });
      const row = el('div', 'landing-row');
      // 자유 연습: 모드가 있는 게임은 카드 안에서 고르고, 없는 게임(스도쿠)은 바로 게임으로
      const freeBtn = game.free ? button('landing-btn', '자유 연습') : link(openUrl(game, 'btn-free-play'), 'landing-btn', '자유 연습');
      const archiveBtn = button('landing-btn', '지난 퍼즐');
      row.append(freeBtn, archiveBtn);
      const mini = el('div', 'landing-mini-actions');
      const statsBtn = button('landing-mini-btn', '통계');
      const dark = button('landing-mini-btn', '다크 모드');
      dark.addEventListener('click', toggleDark);
      mini.append(statsBtn, dark);
      main.append(cards, row, mini);

      // 하위 화면 — 같은 카드 안에서 메인과 바꿔 보여 준다 (카드 가로 폭 그대로)
      const subs = { archive: archiveView(game), stats: statsView(game) };
      if (game.free) subs.free = freeView(game);
      Object.values(subs).forEach((s) => { s.view.hidden = true; });
      let currentView = 'main';
      const show = (name) => {
        if (currentView !== 'main') subs[currentView].close?.();
        currentView = name;
        if (name !== 'main') subs[name].open();
        main.hidden = name !== 'main';
        Object.entries(subs).forEach(([key, s]) => { s.view.hidden = key !== name; });
        back.hidden = name === 'main';
        card.classList.toggle('is-sub', name !== 'main');
      };
      archiveBtn.addEventListener('click', () => show('archive'));
      statsBtn.addEventListener('click', () => show('stats'));
      if (game.free) freeBtn.addEventListener('click', () => show('free'));
      back.addEventListener('click', () => show('main'));
      cardViews.push({ show, current: () => currentView, render: () => { if (currentView !== 'main') subs[currentView].render(); } });

      const footer = el('p', 'landing-footer');
      const repo = link('https://github.com/nuclyee72/ProjectDaily', null, 'nuclyee');
      repo.target = '_blank';
      repo.rel = 'noopener';
      footer.append(repo);

      card.append(back, h1, date, main, ...Object.values(subs).map((s) => s.view), footer);
      slide.append(card);
      track.append(slide);

      const dot = button('hub-dot');
      dot.setAttribute('aria-label', game.title);
      dot.addEventListener('click', () => goTo(i));
      dotsEl.append(dot);
    });

    function refreshStatus() {
      const today = todayStr();
      document.querySelectorAll('[data-date]').forEach((p) => { p.textContent = today; });
      document.querySelectorAll('[data-status-for]').forEach((badge) => {
        const [gi, di] = badge.dataset.statusFor.split(':').map(Number);
        const [text, status] = GAMES[gi].dailies[di].status(today);
        badge.textContent = text;
        badge.dataset.status = status;
      });
      cardViews.forEach((v) => v.render()); // 열려 있는 하위 화면(달력·통계)도 다시
    }

    // ── 슬라이드 이동 ──
    let current = 0;
    function goTo(i, smooth = true) {
      i = Math.max(0, Math.min(GAMES.length - 1, i));
      track.scrollTo({ left: i * track.clientWidth, behavior: smooth ? 'smooth' : 'instant' });
      setCurrent(i);
    }
    function setCurrent(i) {
      current = i;
      [...dotsEl.children].forEach((d, j) => d.setAttribute('aria-current', String(j === i)));
      prevBtn.disabled = i === 0;
      nextBtn.disabled = i === GAMES.length - 1;
      // 게임에서 돌아올 때 같은 게임이 보이도록 주소에 남긴다 (#sudoku 등)
      history.replaceState(null, '', '#' + GAMES[i].slug);
    }
    // 카드가 제자리에 멈췄을 때만 갱신 — 부드러운 스크롤 도중의 중간 위치로 점이 되돌아가지 않게
    track.addEventListener('scroll', () => {
      const x = track.scrollLeft / track.clientWidth;
      const i = Math.round(x);
      if (Math.abs(x - i) < 0.02 && i !== current) setCurrent(i);
    }, { passive: true });
    window.addEventListener('resize', () => { track.scrollLeft = current * track.clientWidth; });
    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && cardViews[current].current() !== 'main') cardViews[current].show('main');
      else if (e.key === 'ArrowLeft') goTo(current - 1);
      else if (e.key === 'ArrowRight') goTo(current + 1);
    });

    // ── 다크 모드 — 허브에서 바꾸면 세 게임 모두 같이 바뀐다 ──
    function toggleDark() {
      const on = document.documentElement.getAttribute('data-theme') !== 'dark';
      if (on) document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
      try { DARK_KEYS.forEach((k) => localStorage.setItem(k, on ? '1' : '0')); } catch {}
    }

    // ── 시작 ──
    refreshStatus();
    const start = GAMES.findIndex((g) => '#' + g.slug === location.hash);
    goTo(start < 0 ? 0 : start, false);
    // 뒤로 가기(bfcache)로 돌아오거나 탭을 다시 볼 때 — 게임에서 바뀐 상태·날짜 반영
    window.addEventListener('pageshow', refreshStatus);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStatus(); });
  </script>
</body>
</html>
